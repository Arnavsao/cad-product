name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Regenerates en.json from the editor registries and checks all 14
      # languages against it. Catches the failure that ships silently: a new
      # key that only exists in English renders in English for everyone else
      # and never errors at runtime. See docs/TRANSLATING.md.
      - run: npm run i18n
      # Fails the build if the generated en.json is not what is committed —
      # otherwise a tool added to the catalog without running `npm run i18n`
      # leaves the translation files permanently one key behind.
      - name: en.json is up to date with the registries
        run: git diff --exit-code -- public/i18n/en.json
      - run: npm run build
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/aagento-cad/browser

  # The NestJS API in server/. Unit tests mock Prisma and storage; the e2e
  # suite needs real Postgres + MinIO, so the same docker-compose services
  # developers use locally are started here. Auth in e2e uses HS256 tokens
  # minted against a test SUPABASE_JWT_SECRET the specs set themselves - no
  # Supabase project is needed in CI.
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      PORT: 3000
      CORS_ORIGIN: http://localhost:4200
      DATABASE_URL: postgresql://cad:cad@localhost:5432/cad
      DIRECT_DATABASE_URL: postgresql://cad:cad@localhost:5432/cad
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: drawings
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Start Postgres and MinIO
        working-directory: .
        run: |
          docker compose up -d --wait postgres minio
          docker compose run --rm minio-init
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
