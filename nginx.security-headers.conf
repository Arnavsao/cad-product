# Security headers, included from every context that needs them.
#
# Separate file because nginx's add_header inheritance is subtractive: a
# location block that declares any add_header of its own discards ALL headers
# inherited from the server block. Several locations here set Cache-Control,
# which silently dropped CSP and the rest until this include existed.
#
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://*.clerk.accounts.dev https://*.clerk.com https://clerk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src https://*.clerk.accounts.dev https://*.clerk.com https://clerk.com" always;
