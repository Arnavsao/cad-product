server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff2;

  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

  # CADOnline API. The app calls a relative `/api/v1/...` in production, so
  # this proxy is what makes that URL exist - without it the request falls into
  # the SPA fallback and gets index.html back. `^~` stops the hashed-asset regex
  # below from ever capturing an API path such as /api/v1/drawings/x.dxf.
  # The upstream name `api` is the service in docker-compose.prod.yml.
  location ^~ /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;   # stream multi-MB text/plain drawing saves
    proxy_read_timeout      120s;
    client_max_body_size    8m;    # 5 MB inline DXF + headroom; nginx's 1 MB default would 413 every save
    add_header Cache-Control "no-store" always;
  }

  # Hashed build artefacts are immutable
  location ~* \.(?:js|css|woff2?|png|ico|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the app shell so new releases are picked up immediately
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
