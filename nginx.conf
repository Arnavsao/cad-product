server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ACME HTTP-01 challenge path for Let's Encrypt / certbot, so TLS can be
  # provisioned without downtime once a domain is pointed at this host.
  # See DEPLOYMENT_TLS.md for the cutover to nginx.ssl.conf.
  location ^~ /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
    default_type "text/plain";
  }

  # NOT under conf.d/ on purpose: nginx's stock http{} block globs
  # conf.d/*.conf directly, and this file's bare `location` blocks are only
  # valid inside a server{} — a second copy in conf.d/ would crash nginx.
  include /etc/nginx/common.conf;
}
