# http{}-context map, loaded via conf.d/*.conf (nginx globs that inside http{}).
# Kept out of common.conf because that file is included inside server{}, where
# `map` is not valid — nginx would refuse to start.
#
# Container Apps ingress terminates TLS and forwards plain HTTP, so $scheme is
# always "http". Trust ingress's X-Forwarded-Proto; default https since public
# ingress is https-only.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      https;
}
