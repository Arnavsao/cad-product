<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CADOnline</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browser-based 2D CAD editor with DXF import/export, layouts, blocks, dimensions and an AI drafting assistant.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    // Apply the persisted theme before first paint to avoid a light/dark flash.
    // Dark is the default when no preference has been saved yet.
    try { if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark-theme-pending'); } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
  <script>
    try {
      if (localStorage.getItem('theme') !== 'light') document.body.classList.add('dark-theme');
      document.documentElement.classList.remove('dark-theme-pending');
    } catch (e) {}
  </script>
</body>
</html>
