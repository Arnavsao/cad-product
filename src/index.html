<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CADO</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browser-based 2D CAD editor with DXF import/export, layouts, blocks, dimensions and an AI drafting assistant.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#181c22">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph / social sharing. og:image/twitter:image and og:url are relative
       for now (no fixed production domain yet) — most crawlers resolve them
       against the page URL, but switch to absolute URLs once a domain exists,
       since some platforms (e.g. Slack, some Twitter/X clients) require it. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="CADO">
  <meta property="og:description" content="Browser-based 2D CAD editor with DXF import/export, layouts, blocks, dimensions and an AI drafting assistant.">
  <meta property="og:image" content="/favicon.svg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="CADO">
  <meta name="twitter:description" content="Browser-based 2D CAD editor with DXF import/export, layouts, blocks, dimensions and an AI drafting assistant.">
  <meta name="twitter:image" content="/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Boot splash. Lives inside <app-root> below, so Angular discards it the
       moment the root component renders — nothing to hide, nothing to time.
       It is the same choreography as UiLogoLoaderComponent
       (src/app/shared/ui/logo-loader.component.ts), inlined because nothing
       from the bundle exists yet. Change one, change both. -->
  <style>
    .boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 22px;
    }
    .boot__mark {
      width: 80px;
      height: 80px;
      color: #4c9aff;
    }
    /* Source order is TL, TR, BL, BR; the delays run clockwise, a quarter-loop
       apart, so no two tiles ever peak together. */
    .boot__tile { animation: boot-dwell 2s ease-in-out infinite; }
    .boot__tile:nth-child(1) { animation-delay: 0s; }
    .boot__tile:nth-child(2) { animation-delay: .5s; }
    .boot__tile:nth-child(3) { animation-delay: 1.5s; }
    .boot__tile:nth-child(4) { animation-delay: 1s; }
    .boot__label {
      font: 500 11px/1 Inter, system-ui, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #8b93a1;
    }
    /* High floor, brief peak: one tile lifts out of the mark rather than three
       dropping away, so the logo reads as itself at all times. */
    @keyframes boot-dwell {
      0%, 100% { opacity: .45; }
      20%      { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot__tile { animation: none; opacity: .6; }
    }
  </style>
  <!-- Theme pre-paint. External (not inline) because production CSP is
       `script-src 'self'` without 'unsafe-inline' — an inline script here is
       blocked and the dark theme silently never applies. Deliberately NOT
       `defer`/`async`: it must run before first paint. -->
  <script src="theme-init.js"></script>
</head>
<body>
  <app-root>
    <div class="boot" role="status" aria-live="polite" aria-label="Loading CADO">
      <svg class="boot__mark" viewBox="0 0 100 100" fill="currentColor" fill-rule="evenodd" aria-hidden="true" focusable="false">
        <path class="boot__tile" d="M8.3 0h28.6a8.3 8.3 0 0 1 8.3 8.3v28.6a8.3 8.3 0 0 1 -8.3 8.3h-28.6a8.3 8.3 0 0 1 -8.3 -8.3v-28.6a8.3 8.3 0 0 1 8.3 -8.3ZM8.9 8.9h27.4v27.4h-27.4Z"/>
        <path class="boot__tile" d="M63.1 0h28.6a8.3 8.3 0 0 1 8.3 8.3v28.6a8.3 8.3 0 0 1 -8.3 8.3h-28.6a8.3 8.3 0 0 1 -8.3 -8.3v-28.6a8.3 8.3 0 0 1 8.3 -8.3ZM63.7 8.9h27.4v27.4h-27.4Z"/>
        <path class="boot__tile" d="M8.3 54.8h28.6a8.3 8.3 0 0 1 8.3 8.3v28.6a8.3 8.3 0 0 1 -8.3 8.3h-28.6a8.3 8.3 0 0 1 -8.3 -8.3v-28.6a8.3 8.3 0 0 1 8.3 -8.3ZM8.9 63.7h27.4v27.4h-27.4Z"/>
        <path class="boot__tile" d="M63.1 54.8h28.6a8.3 8.3 0 0 1 8.3 8.3v28.6a8.3 8.3 0 0 1 -8.3 8.3h-28.6a8.3 8.3 0 0 1 -8.3 -8.3v-28.6a8.3 8.3 0 0 1 8.3 -8.3ZM63.7 63.7h27.4v27.4h-27.4Z"/>
      </svg>
      <span class="boot__label">CADO</span>
    </div>
  </app-root>
  <script src="theme-apply.js"></script>
</body>
</html>
