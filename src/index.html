<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CADOnline</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browser-based 2D CAD editor with DXF import/export, layouts, blocks, dimensions and an AI drafting assistant.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#181c22">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph / social sharing. og:image/twitter:image and og:url are relative
       for now (no fixed production domain yet) — most crawlers resolve them
       against the page URL, but switch to absolute URLs once a domain exists,
       since some platforms (e.g. Slack, some Twitter/X clients) require it. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="CADOnline">
  <meta property="og:description" content="Browser-based 2D CAD editor with DXF import/export, layouts, blocks, dimensions and an AI drafting assistant.">
  <meta property="og:image" content="/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="CADOnline">
  <meta name="twitter:description" content="Browser-based 2D CAD editor with DXF import/export, layouts, blocks, dimensions and an AI drafting assistant.">
  <meta name="twitter:image" content="/icon-512.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    // Paint the persisted theme's background before first paint, so the page
    // never flashes the wrong colour. Dark is the default when nothing is saved.
    try {
      var bg = localStorage.getItem('cad.theme.bg');
      if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark-theme-pending');
      if (bg && /^#[0-9a-f]{3,8}$/i.test(bg)) document.documentElement.style.background = bg;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
  <script>
    try {
      if (localStorage.getItem('theme') !== 'light') document.body.classList.add('dark-theme');
      document.documentElement.classList.remove('dark-theme-pending');
    } catch (e) {}
  </script>
</body>
</html>
