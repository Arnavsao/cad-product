<ng-container *transloco="let t">
@if (dialogSvc.isOpen()) {
<div class="vports-overlay" (click)="onOverlayClick($event)">
  <div class="vports-dialog" role="dialog" aria-modal="true" [attr.aria-label]="t('editor.dialog.vports.title')">
    <!-- Header -->
    <div class="vports-header">
      <div class="vports-title-wrap">
        <!-- <span class="vports-icon">A</span> -->
        <span class="vports-title">{{ t('editor.dialog.vports.title') }}</span>
      </div>
      <button class="vports-close" type="button" (click)="close()" [attr.aria-label]="t('editor.dialog.common.close')">✕</button>
    </div>

    <!-- Tabs -->
    <div class="vports-tabs">
      <button class="tab-btn" type="button" [class.active]="activeTab() === 'new'" (click)="activeTab.set('new')">
        {{ t('editor.dialog.vports.newViewports') }}
      </button>
      <!-- <button class="tab-btn" type="button" [class.active]="activeTab() === 'named'" (click)="activeTab.set('named')">
        Named Viewports
      </button> -->
    </div>

    <!-- Body -->
    <div class="vports-body">
      @if (activeTab() === 'new') {
      <div class="vports-grid">
        <!-- Presets List -->
        <div class="presets-col">
          <label>{{ t('editor.dialog.vports.standardViewports') }}</label>
          <div class="preset-list">
            @for (p of presets; track p.name) {
            <div class="preset-item" [class.selected]="selectedPreset().name === p.name" (click)="selectPreset(p)"
              (dblclick)="confirm()">
              {{ p.name }}
            </div>
            }
          </div>
        </div>

        <!-- Live Preview Box -->
        <div class="preview-col">
          <div class="preview-box-container">
            <div class="preview-header">{{ t('editor.dialog.common.preview') }}</div>
            <div class="preview-canvas-wrap">
              <canvas #previewCanvas></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Controls -->
      <div class="options-row">
        <div class="opt-group">
          <label>{{ t('editor.dialog.vports.applyTo') }}</label>
          <select [(ngModel)]="applyTo">
            <option value="Display">{{ t('editor.dialog.vports.applyDisplay') }}</option>
            <option value="Current Viewport">{{ t('editor.dialog.vports.applyCurrentViewport') }}</option>
          </select>
        </div>

        <div class="opt-group">
          <label>{{ t('editor.dialog.vports.setup') }}</label>
          <select [(ngModel)]="setup">
            <option value="2D">2D</option>
            <option value="3D">3D</option>
          </select>
        </div>

        <div class="opt-group">
          <label>{{ t('editor.dialog.vports.changeViewTo') }}</label>
          <select [(ngModel)]="changeViewTo">
            <option value="*Current*">*Current*</option>
            <option value="Top">{{ t('editor.dialog.vports.viewTop') }}</option>
            <option value="Front">{{ t('editor.dialog.vports.viewFront') }}</option>
            <option value="Right">{{ t('editor.dialog.vports.viewRight') }}</option>
          </select>
        </div>

        <div class="opt-group">
          <label>{{ t('editor.dialog.vports.visualStyle') }}</label>
          <select [(ngModel)]="visualStyle" (change)="renderPreview()">
            @for (vs of visualStyles; track vs.value) {
            <option [value]="vs.value">{{ t(vs.labelKey) }}</option>
            }
          </select>
        </div>
      </div>
      } @else {
      <div style="padding: 40px; text-align: center; color: #64748b;">
        {{ t('editor.dialog.vports.noNamed') }}
      </div>
      }
    </div>

    <!-- Footer Buttons -->
    <div class="vports-footer">
      <button class="btn btn-primary" type="button" (click)="confirm()">{{ t('editor.dialog.common.ok') }}</button>
      <button class="btn" type="button" (click)="close()">{{ t('editor.dialog.common.cancel') }}</button>
      <button class="btn" type="button" (click)="close()">{{ t('editor.dialog.common.help') }}</button>
    </div>
  </div>
</div>
}
</ng-container>
