# TLS-terminated variant of nginx.conf. Use this once a domain points at the
# host and a certificate exists — see DEPLOYMENT_TLS.md for the full cutover
# (updating the Dockerfile COPY line, mounting the cert volume, running
# certbot, and switching docker-compose.prod.yml to publish port 443).
#
# Replace `server_name _;` below with your real domain(s) before requesting
# a certificate — Let's Encrypt validates against the domain, not `_`.

server {
  listen 80;
  server_name _;

  # ACME HTTP-01 challenge — certbot writes into this path over the running
  # container, so renewals don't need to take the site down.
  location ^~ /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
    default_type "text/plain";
  }

  # Everything else: send to HTTPS.
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/CHANGE_ME/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Only add HSTS once you're confident every subdomain in scope also serves
  # HTTPS — it's cached by browsers and hard to walk back quickly.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  include /etc/nginx/common.conf;
}
